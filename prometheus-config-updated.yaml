apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus.monitoring.svc.cluster.local:9090']

      - job_name: 'demo-app'
        static_configs:
          - targets: ['demo-app.monitoring.svc.cluster.local:9113']

      - job_name: 'conduit-backend'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['conduit-backend.default.svc.cluster.local:3000']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'conduit-backend'
          - source_labels: [__address__]
            target_label: service
            replacement: 'conduit-backend'
