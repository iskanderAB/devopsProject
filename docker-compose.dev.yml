version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: conduit_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conduit_dev
      MYSQL_USER: conduit
      MYSQL_PASSWORD: conduit
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    image: node:18-alpine
    container_name: conduit_backend_dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DEV_DB_USERNAME: conduit
      DEV_DB_PASSWORD: conduit
      DEV_DB_NAME: conduit_dev
      DEV_DB_HOSTNAME: mysql
      DEV_DB_DIALECT: mysql
      DEV_DB_LOGGING: false
      JWT_SECRET: your_jwt_secret_here
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:18-alpine
    container_name: conduit_frontend_dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  mysql_dev_data: