apiVersion: apps/v1
kind: Deployment
metadata:
  name: conduit-backend
  labels:
    app: conduit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conduit-backend
  template:
    metadata:
      labels:
        app: conduit-backend
    spec:
      containers:
        - name: conduit-backend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: node-env
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: port
            - name: PROD_DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: prod-db-hostname
            - name: PROD_DB_DIALECT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: prod-db-dialect
            - name: PROD_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: prod-db-name
            - name: PROD_DB_USERNAME
              value: "root"
            - name: PROD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-secret
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: jwt-expires-in
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
