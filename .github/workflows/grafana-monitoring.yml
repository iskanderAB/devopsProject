name: Deploy Monitoring Stack

on:
  push:
    branches:
      - feature/addgrafana
    paths:
      - "kubernetes/monitoring/**"
      - ".github/workflows/grafana-monitoring.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: monitoring
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload monitoring manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          source: "kubernetes/monitoring/"
          target: "~/"
          strip_components: 1

      - name: Apply manifests remotely
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo kubectl apply -f ~/monitoring/namespace.yaml
            sudo kubectl apply -f ~/monitoring/
            sudo kubectl rollout status deployment/prometheus -n monitoring
            sudo kubectl rollout status deployment/grafana -n monitoring
            sudo kubectl rollout status deployment/demo-app -n monitoring
