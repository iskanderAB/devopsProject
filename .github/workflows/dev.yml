name: DEV

on:
  push:
    branches:
      - "mp2l-dev"
      - "feature/addgrafana"

env:
  VERSION: "mp2l-dev-${{ github.sha }}"
  DOCKERHUB: ${{ secrets.DOCKER_USERNAME }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.set_frontend.outputs.frontend }}
      backend: ${{ steps.set_backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_frontend
        run: |
          TARGET_DIR1="frontend"
          TARGET_DIR2="docker/dockerfileFront"
          LATEST_COMMIT=$(git rev-parse HEAD)
          changes_detected=false 
          if git diff --name-only $LATEST_COMMIT~1..$LATEST_COMMIT | grep -E "^${TARGET_DIR1}|^${TARGET_DIR2}"; then
            echo "Changes detected in frontend"
            changes_detected=true
          else
            echo "No changes detected in frontend"
          fi    
          echo "frontend=$changes_detected" >> $GITHUB_OUTPUT

      - id: set_backend
        run: |
          TARGET_DIR1="backend"
          TARGET_DIR2="docker/dockerfileBack"
          LATEST_COMMIT=$(git rev-parse HEAD)
          changes_detected=false 
          if git diff --name-only $LATEST_COMMIT~1..$LATEST_COMMIT | grep -E "^${TARGET_DIR1}|^${TARGET_DIR2}"; then
            echo "Changes detected in backend"
            changes_detected=true
          else
            echo "No changes detected in backend"
          fi    
          echo "backend=$changes_detected" >> $GITHUB_OUTPUT

  build-and-push-frontend:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        env:
          VERSION: ${{ env.VERSION }}
          DOCKERHUB: ${{ env.DOCKERHUB }}
        run: |
          docker build -t ${DOCKERHUB}/conduit-frontend:${VERSION} -f docker/dockerfileFront ./frontend
          docker push ${DOCKERHUB}/conduit-frontend:${VERSION}

  build-and-push-backend:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend image
        env:
          VERSION: ${{ env.VERSION }}
          DOCKERHUB: ${{ env.DOCKERHUB }}
        run: |
          docker build -t ${DOCKERHUB}/conduit-backend:${VERSION} -f docker/dockerfileBack ./backend
          docker push ${DOCKERHUB}/conduit-backend:${VERSION}

  deploy-to-azure:
    needs: [build-and-push-frontend, build-and-push-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts
        env:
          AZURE_VM_IP: ${{ secrets.AZURE_VM_IP }}

      - name: Prepare frontend deployment file
        if: needs.build-and-push-frontend.result == 'success'
        run: |
          sed "s|IMAGE_PLACEHOLDER|${{ env.DOCKERHUB }}/conduit-frontend:${{ env.VERSION }}|g" kubernetes/frontend-deployment.yml > /tmp/frontend-deployment.yml

      - name: Prepare backend deployment file
        if: needs.build-and-push-backend.result == 'success'
        run: |
          sed "s|IMAGE_PLACEHOLDER|${{ env.DOCKERHUB }}/conduit-backend:${{ env.VERSION }}|g" kubernetes/backend-deployment.yml > /tmp/backend-deployment.yml

      - name: Copy Kubernetes files to Azure VM
        run: |
          scp kubernetes/mysql-deplyment.yml kubernetes/mysql-service.yml kubernetes/mysql-secret.yml kubernetes/frontend-service.yml kubernetes/backend-service.yml ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }}:~/

      - name: Copy frontend deployment to Azure VM
        if: needs.build-and-push-frontend.result == 'success'
        run: |
          scp /tmp/frontend-deployment.yml ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }}:~/

      - name: Copy backend deployment to Azure VM
        if: needs.build-and-push-backend.result == 'success'
        run: |
          scp /tmp/backend-deployment.yml ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }}:~/

      - name: Deploy frontend to Minikube
        if: needs.build-and-push-frontend.result == 'success'
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            sudo kubectl apply -f ~/frontend-service.yml
            sudo kubectl apply -f ~/frontend-deployment.yml
            sudo kubectl rollout status deployment/conduit-frontend
          EOF

      - name: Deploy backend to Minikube
        if: needs.build-and-push-backend.result == 'success'
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            sudo kubectl apply -f ~/backend-service.yml
            sudo kubectl apply -f ~/backend-deployment.yml
            sudo kubectl rollout status deployment/conduit-backend
          EOF

      - name: Verify deployment
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            echo "=== Deployments ==="
            sudo kubectl get deployments
            echo "=== Pods ==="
            sudo kubectl get pods
            echo "=== Services ==="
            sudo kubectl get services
          EOF

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful to Azure Minikube!"
          echo "Frontend: http://${{ secrets.AZURE_VM_IP }}:30080"
          echo "Backend: http://${{ secrets.AZURE_VM_IP }}:30030"
