name: DEV

on:
  push:
    branches:
      - "mp2l-dev"

env:
  VERSION: "mp2l-dev-${{ github.sha }}"
  DOCKERHUB: ${{ secrets.DOCKER_USERNAME }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.set_frontend.outputs.frontend }}
      backend: ${{ steps.set_backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_frontend
        run: |
          TARGET_DIR1="frontend"
          TARGET_DIR2="docker/dockerfileFront"
          LATEST_COMMIT=$(git rev-parse HEAD)
          changes_detected=false 
          if git diff --name-only $LATEST_COMMIT~1..$LATEST_COMMIT | grep -E "^${TARGET_DIR1}|^${TARGET_DIR2}"; then
            echo "Changes detected in frontend"
            changes_detected=true
          else
            echo "No changes detected in frontend"
          fi    
          echo "frontend=$changes_detected" >> $GITHUB_OUTPUT

      - id: set_backend
        run: |
          TARGET_DIR1="backend"
          TARGET_DIR2="docker/dockerfileBack"
          LATEST_COMMIT=$(git rev-parse HEAD)
          changes_detected=false 
          if git diff --name-only $LATEST_COMMIT~1..$LATEST_COMMIT | grep -E "^${TARGET_DIR1}|^${TARGET_DIR2}"; then
            echo "Changes detected in backend"
            changes_detected=true
          else
            echo "No changes detected in backend"
          fi    
          echo "backend=$changes_detected" >> $GITHUB_OUTPUT

  build-and-push-frontend:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        run: |
          docker build -t ${DOCKERHUB}/conduit-frontend:${VERSION} -f docker/dockerfileFront ./frontend
          docker push ${DOCKERHUB}/conduit-frontend:${VERSION}

  build-and-push-backend:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${DOCKERHUB}/conduit-backend:${VERSION} -f docker/dockerfileBack ./backend
          docker push ${DOCKERHUB}/conduit-backend:${VERSION}

  deploy-to-azure:
    needs: [build-and-push-frontend, build-and-push-backend]
    runs-on: ubuntu-latest
    if: |
      !cancelled() && 
      (needs.build-and-push-frontend.result == 'success' || 
       needs.build-and-push-backend.result == 'success' ||
       (needs.build-and-push-frontend.result == 'skipped' && needs.build-and-push-backend.result == 'skipped'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if ! ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts; then
            echo "❌ Failed to connect to Azure VM"
            exit 1
          fi
          echo "✅ SSH connection established"
        env:
          AZURE_VM_IP: ${{ secrets.AZURE_VM_IP }}

      - name: Prepare frontend deployment file
        if: needs.build-and-push-frontend.result == 'success'
        run: |
          sed "s|IMAGE_PLACEHOLDER|${{ env.DOCKERHUB }}/conduit-frontend:${{ env.VERSION }}|g" kubernetes/frontend-deployment.yml > /tmp/frontend-deployment.yml

      - name: Prepare backend deployment file
        if: needs.build-and-push-backend.result == 'success'
        run: |
          sed "s|IMAGE_PLACEHOLDER|${{ env.DOCKERHUB }}/conduit-backend:${{ env.VERSION }}|g" kubernetes/backend-deployment.yml > /tmp/backend-deployment.yml
      - name: Prepare kubernetes folder for deploy
        run: |
          rm -rf /tmp/kubernetes || true
          cp -r kubernetes /tmp/kubernetes
          if [ "${{ needs.build-and-push-frontend.result }}" = "success" ]; then
            sed -i "s|IMAGE_PLACEHOLDER|${{ env.DOCKERHUB }}/conduit-frontend:${{ env.VERSION }}|g" /tmp/kubernetes/frontend-deployment.yml
          fi
          if [ "${{ needs.build-and-push-backend.result }}" = "success" ]; then
            sed -i "s|IMAGE_PLACEHOLDER|${{ env.DOCKERHUB }}/conduit-backend:${{ env.VERSION }}|g" /tmp/kubernetes/backend-deployment.yml
          fi

      - name: Copy kubernetes folder to Azure VM
        run: |
          scp -r /tmp/kubernetes ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }}:~/

      - name: Deploy frontend to Minikube
        if: needs.build-and-push-frontend.result == 'success'
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
           echo "=== Deploying Frontend ==="
           sudo kubectl apply -f ~/kubernetes/frontend-service.yml
           sudo kubectl apply -f ~/kubernetes/frontend-deployment.yml
           echo "⏳ Waiting for frontend rollout..."
           sudo kubectl rollout status deployment/conduit-frontend --timeout=300s
          EOF

      - name: Deploy backend to Minikube
        if: needs.build-and-push-backend.result == 'success'
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            echo "=== Deploying Backend ==="
            sudo kubectl apply -f ~/kubernetes/backend-service.yml
            sudo kubectl apply -f ~/kubernetes/backend-deployment.yml
            sudo kubectl rollout status deployment/conduit-backend --timeout=300s
          EOF
